<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Поиск вакансий</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link href="/css/style.css" rel="stylesheet" />
  </head>
  <body>
    <div class="container-fluid">
      <!-- Header -->
      <header class="bg-primary text-white py-3 mb-4">
        <div class="container">
          <h1 class="h3 mb-0">
            <i class="fas fa-briefcase me-2"></i>
            Поиск вакансий
          </h1>
        </div>
      </header>

      <div class="container">
        <!-- Filters -->
        <div class="card mb-4">
          <div class="card-header">
            <h5 class="mb-0">
              <i class="fas fa-filter me-2"></i>Фильтры и поиск
            </h5>
          </div>
          <div class="card-body filter-section">
            <div class="row g-3">
              <div class="col-md-2">
                <label for="cityFilter" class="form-label">Город</label>
                <select id="cityFilter" class="form-select">
                  <option value="">Все города</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="companyFilter" class="form-label">Компания</label>
                <select id="companyFilter" class="form-select">
                  <option value="">Все компании</option>
                </select>
              </div>
              <div class="col-md-2">
                <label for="salaryFromFilter" class="form-label"
                  >Зарплата от</label
                >
                <input
                  type="number"
                  id="salaryFromFilter"
                  class="form-control"
                  placeholder="0"
                  min="0"
                />
              </div>
              <div class="col-md-2">
                <label for="salaryToFilter" class="form-label"
                  >Зарплата до</label
                >
                <input
                  type="number"
                  id="salaryToFilter"
                  class="form-control"
                  placeholder="∞"
                  min="0"
                />
              </div>
              <div class="col-md-2">
                <label for="keywordFilter" class="form-label"
                  >Ключевые слова</label
                >
                <input
                  type="text"
                  id="keywordFilter"
                  class="form-control"
                  placeholder="Поиск по названию, описанию..."
                />
              </div>
              <div class="col-md-2">
                <label class="form-label">&nbsp;</label>
                <div class="d-grid gap-2">
                  <div class="d-flex gap-1">
                    <button id="searchBtn" class="btn btn-primary flex-grow-1">
                      <i class="fas fa-search me-1"></i>
                      Поиск
                    </button>
                    <button
                      id="clearFiltersBtn"
                      class="btn btn-outline-secondary"
                      title="Сбросить все фильтры"
                    >
                      <i class="fas fa-times"></i>
                    </button>
                  </div>
                  <div class="d-flex gap-1">
                    <input
                      type="number"
                      id="pagesInput"
                      class="form-control form-control-sm"
                      style="max-width: 80px"
                      min="1"
                      max="100"
                      value="1"
                      title="Количество страниц для парсинга (1-100, до 100 вакансий на страницу)"
                      data-bs-toggle="tooltip"
                      data-bs-placement="top"
                    />
                    <button
                      id="refreshBtn"
                      class="btn btn-success btn-sm flex-grow-1"
                      title="Загрузить новые вакансии с trudvsem.ru"
                      data-bs-toggle="tooltip"
                      data-bs-placement="top"
                    >
                      <i class="fas fa-sync-alt me-1"></i>
                      Обновить
                    </button>
                  </div>
                  <small class="text-muted mt-1"
                    >Страниц для загрузки (1-100)</small
                  >
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Statistics -->
        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card bg-info text-white">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div>
                    <h6 class="card-title">Всего вакансий</h6>
                    <h3 id="totalVacancies">0</h3>
                  </div>
                  <div class="align-self-center">
                    <i class="fas fa-briefcase fa-2x"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-success text-white">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div>
                    <h6 class="card-title">Городов</h6>
                    <h3 id="totalCities">0</h3>
                  </div>
                  <div class="align-self-center">
                    <i class="fas fa-map-marker-alt fa-2x"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card bg-warning text-white">
              <div class="card-body">
                <div class="d-flex justify-content-between">
                  <div>
                    <h6 class="card-title">Компаний</h6>
                    <h3 id="totalCompanies">0</h3>
                  </div>
                  <div class="align-self-center">
                    <i class="fas fa-building fa-2x"></i>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Loading indicator -->
        <div
          id="loadingIndicator"
          class="text-center mb-4"
          style="display: none"
        >
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Загрузка...</span>
          </div>
          <p class="mt-2">Загрузка вакансий...</p>
        </div>

        <!-- Refresh indicator -->
        <div
          id="refreshIndicator"
          class="text-center mb-4"
          style="display: none"
        >
          <div class="spinner-border text-success" role="status">
            <span class="visually-hidden">Обновление...</span>
          </div>
          <p class="mt-2">Обновление данных с trudvsem.ru...</p>
        </div>

        <!-- Success/Error messages -->
        <div id="messageContainer" class="mb-4" style="display: none">
          <!-- Messages will be inserted here -->
        </div>

        <!-- Vacancies Table -->
        <div class="card">
          <div
            class="card-header d-flex justify-content-between align-items-center"
          >
            <h5 class="mb-0">
              <i class="fas fa-list me-2"></i>
              Список вакансий
            </h5>
          </div>
          <div class="card-body">
            <!-- Table View -->
            <div id="tableView" class="table-responsive">
              <table class="table table-hover">
                <thead class="table-dark">
                  <tr>
                    <th>Название</th>
                    <th>Компания</th>
                    <th>Город</th>
                    <th
                      onclick="app.sortBy('salary')"
                      title="Сортировать по зарплате"
                    >
                      Зарплата <i class="fas fa-sort" id="salary-sort-icon"></i>
                    </th>
                    <th
                      onclick="app.sortBy('publicationDate')"
                      title="Сортировать по дате"
                    >
                      Дата публикации
                      <i class="fas fa-sort" id="date-sort-icon"></i>
                    </th>
                    <th>Источник</th>
                    <th>Действия</th>
                  </tr>
                </thead>
                <tbody id="vacanciesTableBody">
                  <!-- Vacancies will be loaded here -->
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Vacancy Details Modal -->
    <div class="modal fade" id="vacancyModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="vacancyModalTitle"></h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body" id="vacancyModalBody">
            <!-- Vacancy details will be loaded here -->
          </div>
          <div class="modal-footer">
            <a
              id="vacancyLink"
              href="#"
              target="_blank"
              class="btn btn-primary"
            >
              <i class="fas fa-external-link-alt me-1"></i>
              Перейти к вакансии
            </a>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Закрыть
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
